<script>
(function(){
'use strict';
const $=(s,e)=>(e||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

//#ENGINE-START
const DAY=86400000;
const pd=s=>{const p=String(s).split('-').map(Number);return Date.UTC(p[0],p[1]-1,p[2]);};
const mesesEntre=(a,b)=>Math.max(0,(b-a)/DAY)/30;
const round2=n=>Math.round((+n+Number.EPSILON)*100)/100;

function obligacion(m){
  switch(m.tipo){
    case 'aporte_financiado': return {deudor:m.socio,acreedor:m.prestamista,tasa:+m.tasa||0};
    case 'prestamo_socio': return {deudor:m.socio,acreedor:m.prestamista,tasa:+m.tasa||0};
    case 'prestamo_empresa': return {deudor:'empresa',acreedor:m.socio,tasa:+m.tasa||0};
    case 'gasto': return (m.pagadoPor&&m.pagadoPor!=='caja'&&m.reembolsable)?{deudor:'empresa',acreedor:m.pagadoPor,tasa:0}:null;
    default: return null;
  }
}
function efectoCaja(m,byId){
  const v=+m.monto||0;
  switch(m.tipo){
    case 'aporte': case 'aporte_financiado': case 'prestamo_empresa': case 'ingreso': return v;
    case 'retiro': return -v;
    case 'gasto': return (!m.pagadoPor||m.pagadoPor==='caja')?-v:0;
    case 'abono': {const o=byId[m.prestamoId];return (o&&o.deudor==='empresa')?-v:0;}
    default: return 0;
  }
}
function liquidar(o,asOf){
  const r=(+o.tasa||0)/100;
  let P=+o.capital,I=0,last=pd(o.fecha),pagCap=0,pagInt=0;
  const pagos=o.pagos.slice().sort((a,b)=>pd(a.fecha)-pd(b.fecha));
  for(const p of pagos){
    const t=pd(p.fecha);
    if(t>last){I+=P*r*mesesEntre(last,t);last=t;}
    let rest=+p.monto;
    const a=Math.min(rest,I);I-=a;rest-=a;pagInt+=a;
    const b=Math.min(rest,P);P-=b;rest-=b;pagCap+=b;
  }
  const fin=Math.max(pd(asOf),last);
  I+=P*r*mesesEntre(last,fin);
  o.saldoCapital=P;o.interes=I;o.saldo=P+I;o.pagadoCapital=pagCap;o.pagadoInteres=pagInt;o.pagado=pagCap+pagInt;
  o.estado=o.saldo<0.5?'pagada':((o.vence&&o.vence<asOf)?'vencida':'vigente');
  return o;
}
function mesesRecientes(asOf,n){
  const p=asOf.split('-').map(Number),out=[];
  for(let i=n-1;i>=0;i--){const d=new Date(Date.UTC(p[0],p[1]-1-i,1));out.push(d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0'));}
  return out;
}
function calcular(movs,socios,asOf){
  const ids=socios.map(s=>s.id),por={},obligs=[],byId={};
  ids.forEach(id=>{por[id]={capital:0,retiros:0};});
  for(const m of movs){
    const b=obligacion(m);
    if(b){const o=Object.assign({id:m.id,mov:m,capital:+m.monto||0,fecha:m.fecha,vence:m.vence||null,pagos:[]},b);obligs.push(o);byId[m.id]=o;}
  }
  for(const m of movs){if(m.tipo==='abono'&&byId[m.prestamoId])byId[m.prestamoId].pagos.push({id:m.id,fecha:m.fecha,monto:+m.monto||0});}
  obligs.forEach(o=>liquidar(o,asOf));
  let caja=0,ingresos=0,gastos=0,retiros=0;
  const keys=mesesRecientes(asOf,6),mens={};
  keys.forEach(k=>{mens[k]={k:k,ing:0,gas:0};});
  for(const m of movs){
    const v=+m.monto||0;
    caja+=efectoCaja(m,byId);
    if(m.tipo==='aporte'||m.tipo==='aporte_financiado'){if(por[m.socio])por[m.socio].capital+=v;}
    else if(m.tipo==='gasto'){gastos+=v;if(m.pagadoPor&&m.pagadoPor!=='caja'&&!m.reembolsable&&por[m.pagadoPor])por[m.pagadoPor].capital+=v;const k=String(m.fecha).slice(0,7);if(mens[k])mens[k].gas+=v;}
    else if(m.tipo==='ingreso'){ingresos+=v;const k=String(m.fecha).slice(0,7);if(mens[k])mens[k].ing+=v;}
    else if(m.tipo==='retiro'){retiros+=v;if(por[m.socio])por[m.socio].retiros+=v;}
  }
  const utilidad=ingresos-gastos;
  let capitalTotal=0;
  ids.forEach((id,i)=>{
    const p=por[id],s=socios[i];
    p.comprometido=+s.comprometido||0;p.falta=Math.max(0,p.comprometido-p.capital);
    p.pct=+s.participacion||0;p.parte=utilidad*p.pct/100;
    p.debe=0;p.leDebenSocios=0;p.leDebeEmpresa=0;capitalTotal+=p.capital;
  });
  let empresaDebe=0;
  for(const o of obligs){
    if(o.saldo<0.5)continue;
    if(por[o.deudor])por[o.deudor].debe+=o.saldo;
    if(o.deudor==='empresa')empresaDebe+=o.saldo;
    if(por[o.acreedor]){if(o.deudor==='empresa')por[o.acreedor].leDebeEmpresa+=o.saldo;else por[o.acreedor].leDebenSocios+=o.saldo;}
  }
  const deuda=(a,b)=>obligs.reduce((t,o)=>(o.deudor===a&&o.acreedor===b&&o.saldo>=0.5)?t+o.saldo:t,0);
  const pares=[];
  for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){
    const a=ids[i],b=ids[j],d1=deuda(a,b),d2=deuda(b,a),net=d1-d2;
    if(Math.abs(net)>=0.5)pares.push(net>0?{deudor:a,acreedor:b,monto:net,d1:d1,d2:d2}:{deudor:b,acreedor:a,monto:-net,d1:d2,d2:d1});
  }
  return {caja,ingresos,gastos,retiros,utilidad,capitalTotal,por,obligs,byId,pares,empresaDebe,meses:keys.map(k=>mens[k])};
}

function hoy(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const nfs={};
function fmt(n){const v=Math.round(+n)||0;const nf=nfs[curCode]||(nfs[curCode]=new Intl.NumberFormat('es-CO',{style:'currency',currency:curCode,maximumFractionDigits:0,minimumFractionDigits:0}));return nf.format(v);}
const nfc=new Intl.NumberFormat('es-CO',{notation:'compact',maximumFractionDigits:1});
const fmtC=v=>nfc.format(v);
const fmtPct=n=>(+n||0).toLocaleString('es-CO',{maximumFractionDigits:2})+' %';
function fmtD(s){if(!s)return '';const p=String(s).split('-').map(Number);return new Date(Date.UTC(p[0],p[1]-1,p[2])).toLocaleDateString('es-CO',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});}
function parseMonto(s){
  s=String(s==null?'':s).replace(/[^\d.,-]/g,'');
  if(!s)return NaN;
  const lc=s.lastIndexOf(','),ld=s.lastIndexOf('.');
  if(lc>-1&&ld>-1){const dec=lc>ld?',':'.',th=dec===','?'.':',';s=s.split(th).join('').replace(dec,'.');}
  else if(lc>-1){const p=s.split(',');s=(p.length>2||p[1].length===3)?p.join(''):p[0]+'.'+p[1];}
  else if(ld>-1){const p=s.split('.');if(p.length>2||p[1].length===3)s=p.join('');}
  return parseFloat(s);
}

function efectoCajaM(m){return efectoCaja(m,(state.C&&state.C.byId)||{});}
function deudaLabel(o){return nom(o.deudor)+' → '+nom(o.acreedor)+(o.mov.concepto?' · '+o.mov.concepto:'');}
function quien(m,C){
  switch(m.tipo){
    case 'aporte': return nom(m.socio);

    case 'abono': {const o=C.byId[m.prestamoId];return o?nom(o.deudor)+' paga a '+nom(o.acreedor):'Deuda eliminada';}
    case 'gasto': return (!m.pagadoPor||m.pagadoPor==='caja')?'Caja de la empresa':'Pagó '+nom(m.pagadoPor)+(m.reembolsable?' (por reembolsar)':' (como aporte)');
    case 'retiro': return nom(m.socio);

function detalle(m,C){
  if(m.concepto)return m.concepto;
  if(m.tipo==='abono'){const o=C.byId[m.prestamoId];return o?'Abono: '+deudaLabel(o):'Abono a una deuda eliminada';}
  return TIPOS[m.tipo]?TIPOS[m.tipo].corto:m.tipo;
}

function niceMax(v){const e=Math.pow(10,Math.floor(Math.log10(v))),f=v/e;return (f<=1?1:f<=2?2:f<=4?4:f<=5?5:10)*e;}
function chartHTML(M){
  const W=640,H=240,L=58,R=10,T=12,B=34,iw=W-L-R,ih=H-T-B;
  const raw=Math.max(0,...M.flatMap(m=>[m.ing,m.gas]));
  if(raw<=0)return null;
  const mx=niceMax(raw),y=v=>T+ih-(v/mx)*ih,gw=iw/M.length,bw=Math.min(26,gw*.26);
  let g='';
  for(let i=0;i<=4;i++){const v=mx*i/4,yy=y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" class="gl"/><text x="${L-8}" y="${yy+4}" text-anchor="end" class="ax">${esc(fmtC(v))}</text>`;}
  M.forEach((m,i)=>{
    const cx=L+gw*i+gw/2,p=m.k.split('-').map(Number);
    const lab=new Date(Date.UTC(p[0],p[1]-1,1)).toLocaleDateString('es-CO',{month:'short',timeZone:'UTC'}).replace('.','');
    g+=`<rect x="${cx-bw-2}" y="${y(m.ing)}" width="${bw}" height="${(m.ing/mx)*ih}" class="bi"><title>${esc(lab+': ingresos '+fmt(m.ing))}</title></rect>`;
    g+=`<rect x="${cx+2}" y="${y(m.gas)}" width="${bw}" height="${(m.gas/mx)*ih}" class="bg"><title>${esc(lab+': gastos '+fmt(m.gas))}</title></rect>`;
    g+=`<text x="${cx}" y="${H-12}" text-anchor="middle" class="ax">${esc(lab)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos y gastos por mes">${g}</svg>`;
}

function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;},3800);}
function errMsg(e){
  const c=e&&e.code;
  if(c==='quota_exceeded')return 'Se llenó el espacio del libro. Elimina movimientos que ya no necesites.';
  if(c==='invalid_argument')return 'No se pudo guardar. Puede que no tengas permiso de edición en este libro; pídeselo al dueño.';
  if(c==='resource_exhausted')return 'Hubo demasiadas operaciones seguidas. Espera unos segundos e inténtalo de nuevo.';
  if(c==='revoked')return 'Ya no tienes acceso a este libro.';
  return 'No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.';
}

function efectoTexto(d){
  const v=parseMonto(d.monto),M=(isFinite(v)&&v>0)?fmt(v):'el monto',n=nom;
  const ta=(parseMonto(d.tasa)>0)?' con interés del '+fmtPct(parseMonto(d.tasa))+' mensual':'';
  switch(d.tipo){
    case 'aporte': return 'Entran '+M+' a la caja y suben el capital de '+n(d.socio)+'.';
    case 'aporte_financiado': return 'Entran '+M+' a la caja y suben el capital de '+n(d.socio)+'. '+n(d.socio)+' queda debiéndole '+M+' a '+n(d.prestamista)+ta+'.';
    case 'prestamo_empresa': return 'Entran '+M+' a la caja. La empresa le debe '+M+' a '+n(d.socio)+ta+'. No suma al capital.';
    case 'prestamo_socio': return 'No se mueve la caja de la empresa. '+n(d.socio)+' le debe '+M+' a '+n(d.prestamista)+ta+'.';
    case 'abono': {const o=obligsParaAbono().find(x=>x.id===d.prestamoId);if(!o)return 'Elige la deuda que se está pagando.';
      return 'Baja la deuda de '+(o.deudor==='empresa'?'la empresa':n(o.deudor))+' con '+n(o.acreedor)+'. '+(o.deudor==='empresa'?'Salen '+M+' de la caja.':'No se mueve la caja de la empresa.');}
    case 'gasto': return d.pagadoPor==='caja'?'Salen '+M+' de la caja.':(d.reembolsable?'La caja no se mueve. La empresa le debe '+M+' a '+n(d.pagadoPor)+'.':'La caja no se mueve. Se cuenta como aporte de capital de '+n(d.pagadoPor)+'.');
    case 'ingreso': return 'Entran '+M+' a la caja y suman a los ingresos.';
    case 'retiro': return 'Salen '+M+' de la caja hacia '+n(d.socio)+'.';
    default: return '';
  }
}
function updateHints(){
  const d=state.draft,v=parseMonto(d.monto),h=$('#montoHint');
  if(h)h.textContent=(isFinite(v)&&v>0)?'= '+fmt(v):'';
  $('#dlgEfecto').textContent=efectoTexto(d);
}
function validar(d){
  if(!d.fecha)return 'Falta la fecha.';
  const v=parseMonto(d.monto);
  if(!isFinite(v)||v<=0)return 'Escribe un monto mayor que cero.';
  if((d.tipo==='gasto'||d.tipo==='ingreso')&&!d.concepto.trim())return d.tipo==='gasto'?'Cuenta en qué se gastó.':'Cuenta qué se vendió o quién pagó.';
  if((d.tipo==='aporte_financiado'||d.tipo==='prestamo_socio')&&d.socio===d.prestamista)return 'Quien presta y quien recibe deben ser socios distintos.';
  if(['aporte_financiado','prestamo_empresa','prestamo_socio'].includes(d.tipo)){
    const t=d.tasa.trim()===''?0:parseMonto(d.tasa);
    if(!isFinite(t)||t<0||t>100)return 'El interés mensual debe estar entre 0 y 100.';
    if(d.vence&&d.vence<d.fecha)return 'La fecha límite no puede ser anterior a la fecha del movimiento.';
  }
  if(d.tipo==='abono'){
    const o=obligsParaAbono().find(x=>x.id===d.prestamoId);
    if(!o)return 'Elige la deuda que se está pagando.';
    if(v>o.saldo+1)return 'El abono ('+fmt(v)+') supera el saldo de esa deuda ('+fmt(o.saldo)+').';
  }
  if(state.edit&&state.movs.some(m=>m.tipo==='abono'&&m.prestamoId===state.edit)){
    const r=toRecord(d);
    if(!obligacion(r))return 'Esta deuda ya tiene abonos. Elimina los abonos antes de cambiar el tipo de movimiento.';
  }
  return null;
}
function toRecord(d){
  const r={tipo:d.tipo,fecha:d.fecha,monto:round2(parseMonto(d.monto)),concepto:d.concepto.trim(),nota:d.nota.trim()};
  const tasa=()=>{const t=d.tasa.trim()===''?0:parseMonto(d.tasa);return round2(t);};
  switch(d.tipo){
    case 'aporte': case 'retiro': r.socio=d.socio;break;
    case 'aporte_financiado': case 'prestamo_socio': r.socio=d.socio;r.prestamista=d.prestamista;r.tasa=tasa();if(d.vence)r.vence=d.vence;break;
    case 'prestamo_empresa': r.socio=d.socio;r.tasa=tasa();if(d.vence)r.vence=d.vence;break;
    case 'abono': r.prestamoId=d.prestamoId;break;
    case 'gasto': r.pagadoPor=d.pagadoPor;if(d.categoria)r.categoria=d.categoria;if(d.pagadoPor!=='caja')r.reembolsable=!!d.reembolsable;break;
    case 'ingreso': if(d.categoria)r.categoria=d.categoria;break;
  }
  return r;
}
function abrirForm(m,preset){
  if(!state.ready||!state.canWrite)return;
  state.edit=m?m.id:null;
  state.draft=m?toDraft(m):newDraft(preset);
  $('#dlgTitle').textContent=m?'Editar movimiento':'Registrar movimiento';
  getCfg();
  drawForm();
  const dlg=$('#dlg');
  if(!dlg.open)dlg.showModal();
}
async function guardarMov(){
  const d=state.draft,err=validar(d),eb=$('#dlgErr');
  if(err){eb.textContent=err;eb.hidden=false;return;}
  const btn=$('#dlgSave');btn.disabled=true;
  try{
    const rec=toRecord(d);
    let ref;
    if(state.edit){
      const old=state.movs.find(m=>m.id===state.edit)||{};
      ref=state.db.doc('movs/'+state.edit);
      rec.creado=old.creado||Date.now();rec.por=old.por||null;rec.editado=Date.now();
    }else{
      ref=state.db.collection('movs').doc();
      rec.creado=Date.now();rec.por=state.myId||null;
    }
    await ref.set(JSON.parse(JSON.stringify(rec)));
    $('#dlg').close();
    toast(state.edit?'Movimiento actualizado':'Movimiento guardado');
  }catch(e){eb.textContent=errMsg(e);eb.hidden=false;}
  finally{btn.disabled=false;}
}
async function eliminarMov(id){
  state.confirmDel=null;
  if(state.movs.some(m=>m.tipo==='abono'&&m.prestamoId===id)){toast('Esa deuda tiene abonos. Elimina primero los abonos.');render(true);return;}
  try{await state.db.doc('movs/'+id).delete();toast('Movimiento eliminado');}
  catch(e){toast(errMsg(e));render(true);}
}
async function borrarEjemplos(){
  const ids=state.movs.filter(m=>m.ejemplo).map(m=>m.id);
  try{for(const id of ids){await state.db.doc('movs/'+id).delete();}toast('Datos de ejemplo borrados');}
  catch(e){toast(errMsg(e));}
}
async function guardarCfg(){
  const eb=$('#cfgErr'),cur=getCfg(),show=m=>{eb.textContent=m;eb.hidden=false;};
  const nombre=$('#c-nombre').value.trim();
  if(!nombre)return show('Escribe el nombre de la empresa.');
  const socios=[];
  for(let i=0;i<cur.socios.length;i++){
    const n=$('#c-n-'+i).value.trim(),p=parseMonto($('#c-p-'+i).value),c=$('#c-c-'+i).value.trim()===''?0:parseMonto($('#c-c-'+i).value);
    if(!n)return show('Falta el nombre del socio '+(i+1)+'.');
    if(!isFinite(p)||p<0||p>100)return show('La participación del socio '+(i+1)+' debe estar entre 0 y 100.');
    if(!isFinite(c)||c<0)return show('El compromiso de aporte del socio '+(i+1)+' no es válido.');
    socios.push({id:cur.socios[i].id,nombre:n,participacion:round2(p),comprometido:round2(c)});
  }
  eb.hidden=true;
  try{await state.db.doc('config/empresa').set({nombre:nombre,moneda:$('#c-moneda').value,socios:socios});toast('Cambios guardados');pending=false;render(true);}
  catch(e){show(errMsg(e));}
}
async function exportar(){
  let dl=null;
  try{dl=await window.claude.use('downloads');}catch(_){}
  if(!dl){toast('La descarga no está disponible en esta vista.');return;}
  const C=state.C,cell=v=>{const s=String(v==null?'':v);return /[";\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  const head=['Fecha','Tipo','Detalle','Categoría','Quién','Monto','Efecto en caja','Interés mensual %','Fecha límite','Nota'];
  const rows=state.movs.slice().sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:(a.creado||0)-(b.creado||0)).map(m=>
    [m.fecha,TIPOS[m.tipo]?TIPOS[m.tipo].corto:m.tipo,detalle(m,C),m.categoria||'',quien(m,C),m.monto,efectoCajaM(m),m.tasa||'',m.vence||'',m.nota||''].map(cell).join(';'));
  try{await dl.save({filename:'libro-de-socios-'+hoy()+'.csv',data:'﻿'+[head.map(cell).join(';')].concat(rows).join('\r\n')});toast('Archivo listo. Ábrelo con Excel o Google Sheets.');}
  catch(e){if(!e||e.code!=='declined')toast('No se pudo preparar el archivo.');}
}

/* ---------- Eventos ---------- */
function go(tab){state.tab=tab;state.confirmDel=null;render(true);window.scrollTo(0,0);}
document.addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]');if(tb){go(tb.dataset.tab);return;}
  const tg=e.target.closest('[data-tab-go]');if(tg){go(tg.dataset.tabGo);return;}
  const dc=e.target.closest('[data-deuda]');if(dc){state.f.deuda=dc.dataset.deuda;render(true);return;}
  const b=e.target.closest('[data-act]');if(!b)return;
  const id=b.dataset.id,a=b.dataset.act;
  if(a==='nuevo')abrirForm(null);
  else if(a==='cerrar')$('#dlg').close();
  else if(a==='abonar')abrirForm(null,{tipo:'abono',prestamoId:id});
  else if(a==='editar'){const m=state.movs.find(x=>x.id===id);if(m)abrirForm(m);}
  else if(a==='eliminar'){state.confirmDel=id;render(true);}
  else if(a==='eliminar-no'){state.confirmDel=null;render(true);}
  else if(a==='eliminar-si')eliminarMov(id);
  else if(a==='borrar-ejemplos')borrarEjemplos();
  else if(a==='guardar-cfg')guardarCfg();
  else if(a==='exportar')exportar();
  else if(a==='pagar-todo'){const o=obligsParaAbono().find(x=>x.id===state.draft.prestamoId);if(o){state.draft.monto=String(round2(o.saldo)).replace('.',',');$('#f-monto').value=state.draft.monto;updateHints();}}
});
document.addEventListener('input',e=>{
  const f=e.target.closest('[data-filter]');
  if(f){state.f[f.dataset.filter]=f.value;render(true);return;}
  if(e.target.id&&e.target.id.indexOf('c-p-')===0){
    let t=0;getCfg().socios.forEach((s,i)=>{const v=parseMonto($('#c-p-'+i).value);if(isFinite(v))t+=v;});
    const el=$('#sumPart');if(el)el.textContent='Los porcentajes suman '+fmtPct(t)+'.';
  }
});
$('#dlgFields').addEventListener('input',onField);
$('#dlgFields').addEventListener('change',onField);
function onField(e){
  const el=e.target.closest('[data-k]');if(!el)return;
  const k=el.dataset.k,d=state.draft;
  d[k]=el.type==='checkbox'?el.checked:el.value;
  if(e.type==='change'&&(k==='tipo'||k==='pagadoPor')){drawForm();const f=$('#f-'+(k==='tipo'?'tipo':'pag'));if(f)f.focus();return;}
  if(e.type==='change'&&(k==='socio'||k==='prestamista'||k==='prestamoId')){fixDraft(d);if(k!=='prestamoId'){drawForm();const f=$(k==='socio'?'#f-socio':'#f-prest');if(f)f.focus();return;}}
  updateHints();
}
$('#dlgForm').addEventListener('submit',e=>{e.preventDefault();guardarMov();});
document.addEventListener('focusout',()=>{setTimeout(()=>{if(pending&&!typing())render();},0);});

/* ---------- Arranque ---------- */
async function ensureNames(){
  if(!state.user)return;
  const need=Array.from(new Set(state.movs.map(m=>m.por).filter(Boolean))).filter(id=>!(id in state.names));
  if(!need.length)return;
  need.forEach(id=>{state.names[id]='';});
  try{const ps=await state.user.profiles(need);need.forEach(id=>{state.names[id]=(ps[id]&&ps[id].name)||'';});}catch(_){}
  render();
}
function onReady(){if(state.cfgReady&&state.movsReady)state.ready=true;render();ensureNames();}
(async function init(){
  const h=location.hash.slice(1);
  if(['resumen','movimientos','deudas','socios'].includes(h))state.tab=h;
  render();
  let db=null,user=null;
  try{if(window.claude&&window.claude.use){db=await window.claude.use('db');user=await window.claude.use('user');}}catch(_){}
  state.db=db;state.user=user;
  if(!db){state.dbOk=false;render();return;}
  if(user){
    try{state.myId=await user.id();}catch(_){}
    try{const c=await user.can('data.write');state.canWrite=(c!==false);}catch(_){}
  }
  const fail=e=>{if(e&&e.code==='revoked'){state.dbOk=false;}render();};
  db.doc('config/empresa').onSnapshot(s=>{state.cfg=s.exists?s.data():null;state.cfgReady=true;onReady();},fail);
  db.collection('movs').onSnapshot(s=>{state.movs=s.docs.map(d=>Object.assign({id:d.id},d.data()));state.movsReady=true;onReady();},fail);
})();
})();
</script>
